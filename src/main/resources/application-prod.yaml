# Production profile - PostgreSQL database
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:template_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging - SLF4J
logging:
  level:
    root: WARN
    sti.project.template: INFO

# Security - JWT Configuration (use environment variable in production)
app:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      authorities-claim-name: authorities
      access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}

  # Data Initializer - Auto create roles and users on startup
  initializer:
    enabled: ${INIT_ENABLED:false}
    roles:
      - name: ADMIN
        description: Administrator role with full access
      - name: USER
        description: Standard user role
      - name: MANAGER
        description: Manager role with limited admin access
    users:
      - name: Admin
        email: ${ADMIN_EMAIL:admin@example.com}
        password: ${ADMIN_PASSWORD}
        phone: ${ADMIN_PHONE:0123456789}
        roles:
          - ADMIN

