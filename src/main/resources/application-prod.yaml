server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  config: classpath:log4j2-spring-prod.xml

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      authorities-claim-name: authorities
      access-token-expiration: ${JWT_ACCESS_EXPIRATION}
      refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}
  file:
    upload-dir: ${FILE_UPLOAD_DIR}
    max-file-size: ${FILE_MAX_SIZE}
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    base-url: ${FILE_BASE_URL}
    cleanup-enabled: true
    cleanup-after-hours: 24