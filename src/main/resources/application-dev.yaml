# Development profile - H2 in-memory database
server:
  port: 9812

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging - SLF4J
logging:
  level:
    root: INFO
    sti.project.template: DEBUG
    org.hibernate.SQL: DEBUG

# Security - JWT Configuration
app:
  security:
    jwt:
      secret-key: my-super-secret-key-for-development-only-must-be-at-least-32-characters
      authorities-claim-name: authorities
      access-token-expiration: 3600       # 1 hour (in seconds)
      refresh-token-expiration: 604800    # 7 days (in seconds)

  # Data Initializer - Auto create roles and users on startup
  initializer:
    enabled: true
    roles:
      - name: ADMIN
        description: Administrator role with full access
      - name: USER
        description: Standard user role
      - name: MANAGER
        description: Manager role with limited admin access
    users:
      - name: Admin
        email: admin@example.com
        password: Admin@123
        phone: "0123456789"
        roles:
          - ADMIN
      - name: Default User
        email: user@example.com
        password: User@123
        phone: "0987654321"
        roles:
          - USER
