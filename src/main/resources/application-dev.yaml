# Development profile - H2 in-memory database
server:
  port: 9812

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging - SLF4J
logging:
  level:
    root: INFO
    sti.project.template: DEBUG
    org.hibernate.SQL: DEBUG

# Security - JWT Configuration
app:
  security:
    jwt:
      secret-key: ${JWT_SECRET:my-super-secret-key-for-development-only-must-be-at-least-32-characters}
      authorities-claim-name: authorities
