# Development profile - H2 in-memory database
server:
  port: 9812

spring:
  datasource:
    url: jdbc:postgresql://ep-quiet-heart-ah787smp-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    driver-class-name: org.postgresql.Driver
    username: neondb_owner
    password: npg_L8bV4OmfuUqx

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging - SLF4J
logging:
  level:
    root: INFO
    sti.project.template: DEBUG
    org.hibernate.SQL: DEBUG

# Security - JWT Configuration
app:
  security:
    jwt:
      secret-key: my-super-secret-key-for-development-only-must-be-at-least-32-characters
      authorities-claim-name: authorities
      access-token-expiration: 3600       # 1 hour (in seconds)
      refresh-token-expiration: 604800    # 7 days (in seconds)