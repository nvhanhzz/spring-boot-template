server:
  port: 9812

spring:
  datasource:
    url: jdbc:postgresql://192.168.1.61:5433/scada-dev
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  config: classpath:log4j2-spring.xml

app:
  security:
    jwt:
      secret-key: my-super-secret-key-for-development-only-must-be-at-least-32-characters
      authorities-claim-name: authorities
      access-token-expiration: 3600
      refresh-token-expiration: 604800
  file:
    upload-dir: /sti-file-storage/uploads
    max-file-size: 10485760
    allowed-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    base-url: http://localhost
    cleanup-enabled: true
    cleanup-after-hours: 24